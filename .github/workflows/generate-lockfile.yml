# TEMPORARY: This workflow will be removed from the review branch once the
# package-lock.json has been generated. The job writes ONLY to this branch.
name: Temporary lockfile generator
on:
  push:
    branches: [chore/supabase-future-proofing-20261022]
    paths: ['.github/workflows/generate-lockfile.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/supabase-future-proofing-20261022
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve lockfile without running dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit to this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: commit reproducible npm lockfile"
          git push origin HEAD:chore/supabase-future-proofing-20261022
