name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - name: Upload assessment PDF examples and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assessment-export-evidence
          path: |
            test-results/
            docs/assessment-export.md
            docs/multipart-numbering-followup.md
            docs/smart-shadow-assessments.md
            docs/gcse-grade-interpretation.md
            docs/grade-interpretation-examples/
          if-no-files-found: ignore
          retention-days: 14
